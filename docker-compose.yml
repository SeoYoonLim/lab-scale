version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_investment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_investment
    ports:
      # 호스트 5432는 Windows 예약 포트 범위(5357-5456)에 걸려 바인딩이 거부되므로 15432 사용
      # 127.0.0.1에만 연다(2026-10-30 보안 점검): 기본 계정(postgres/postgres)의 DB가 같은 네트워크의 다른 기기에 열리지 않게.
      # 실행 중인 컨테이너에는 docker compose up -d로 다시 만들 때 반영된다.
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: