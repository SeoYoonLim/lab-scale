# 클라우드 시장 데이터 수집(2026-11-23). 집 PC·Ollama·로컬 DB 없이 GitHub-hosted runner에서 돈다.
# 수집기: backend/scripts/cloud_market_data.py(기존 수집기의 원천 조회·확정 규칙 재사용) -> 암호화 패키지
# 보관: 같은 저장소의 market-data 브랜치(앱 코드·.env 없음, 암호문 + 평문 manifest). 집 PC: backend/app/market_data_sync.py
#
# 예약(cron은 UTC, KST = UTC+9, 정각을 피함). 한 번의 성공에 기대지 않고 하루 여러 번 돈다(없는 행만 쌓이므로 중복 없음).
#   09:40 KST  직전 거래일 주식 공식 종가 확정(다음 거래일 개장 뒤 가능) + 환율 직전 평일(런던 일봉 09:00 KST 마감) + 지수(FDR 06~07시 갱신)
#   10:25 KST  같은 것 재시도
#   18:35 KST  1차: 당일 ETF·지수 시도·뉴스·공시
#   19:50 KST  2차 재시도
#   21:45 KST  3차: 지수(FDR 캐시 마감 뒤 갱신 21~23시)
#   23:47 KST  최종: 지수
# 휴장일·주말은 수집기가 KRX 달력으로 판단해 건너뛴다(종료 코드 3 = 정상 건너뜀).
# 필요한 Secrets: MARKET_DATA_KEY(필수, 패키지 암호화), NAVER_CLIENT_ID·NAVER_CLIENT_SECRET(뉴스), DART_API_KEY(공시). 없으면 그 구역만 건너뜀.
name: market-data

on:
  schedule:
    - cron: "40 0 * * 1-5"
    - cron: "25 1 * * 1-5"
    - cron: "35 9 * * 1-5"
    - cron: "50 10 * * 1-5"
    - cron: "45 12 * * 1-5"
    - cron: "47 14 * * 1-5"
  workflow_dispatch:
    inputs:
      sections:
        description: "쉼표 구분 구역(stocks,etfs,indices,fx,news,disclosures)"
        default: "stocks,etfs,indices,fx,news,disclosures"
      force:
        description: "휴장일에도 수집"
        type: boolean
        default: false
  push:
    # 작업 브랜치 검증: 이 파일이나 수집기를 바꾼 push는 수집·건수 확인만 한다(게시하지 않음, 키 불필요)
    paths:
      - ".github/workflows/market-data.yml"
      - "backend/scripts/cloud_market_data.py"
      - "backend/app/market_package.py"

permissions:
  contents: write  # market-data 브랜치에 패키지 커밋(GITHUB_TOKEN). 그 밖의 권한 없음

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      TZ: Asia/Seoul
      # DB를 쓰지 않는다. 실수로 연결하려 하면 바로 실패하도록 닫힌 주소
      DATABASE_URL: postgresql+psycopg://dummy:dummy@127.0.0.1:1/dummy
      MARKET_DATA_KEY: ${{ secrets.MARKET_DATA_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: 실행 정보
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }} run=${{ github.run_id }}/${{ github.run_attempt }}"
          echo "실행 시각(KST): $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "MARKET_DATA_KEY: $([ -n "$MARKET_DATA_KEY" ] && echo 설정됨 || echo 없음)  NAVER: $([ -n "$NAVER_CLIENT_ID" ] && echo 설정됨 || echo 없음)  DART: $([ -n "$DART_API_KEY" ] && echo 설정됨 || echo 없음)"

      - name: 게시 여부 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "작업 브랜치 push: 수집·건수 확인만"
          elif [ -z "$MARKET_DATA_KEY" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::warning::MARKET_DATA_KEY Secret이 없어 수집·건수 확인만 한다(게시 안 함)"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: market-data 브랜치 준비
        if: steps.mode.outputs.publish == 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin market-data >/dev/null; then
            git fetch --depth 1 origin market-data
            git worktree add data FETCH_HEAD
            git -C data checkout -B market-data
          else
            git worktree add --detach data
            git -C data checkout --orphan market-data
            git -C data rm -rfq .
          fi

      - name: 수집(실패하면 3분 뒤 한 번 더)
        id: collect
        run: |
          SECTIONS="${{ github.event.inputs.sections || 'stocks,etfs,indices,fx,news,disclosures' }}"
          # 뉴스·공시는 저녁 1차(18:35)·아침(09:40)·수동 실행에서만(데이터 브랜치 크기 제한)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "35 9 * * 1-5" ] && [ "${{ github.event.schedule }}" != "40 0 * * 1-5" ]; then
            SECTIONS="stocks,etfs,indices,fx"
          fi
          EXTRA=""
          [ "${{ github.event.inputs.force }}" = "true" ] && EXTRA="--force"
          if [ "${{ steps.mode.outputs.publish }}" = "true" ]; then
            ARGS="--out ../out --publish-dir ../data --sections $SECTIONS --summary-file ../summary.json $EXTRA"
          else
            ARGS="--collect-only --sections $SECTIONS --summary-file ../summary.json $EXTRA"
          fi
          for attempt in 1 2; do
            set +e; python -m scripts.cloud_market_data $ARGS; code=$?; set -e
            echo "시도 $attempt 종료 코드 $code"
            if [ $code -ne 1 ]; then break; fi
            rm -rf ../out; sleep 180
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ $code -eq 3 ]; then echo "휴장일·주말: 건너뜀"; exit 0; fi
          exit $code

      - name: 게시(push, 충돌이면 다시 받아서 재시도)
        if: steps.mode.outputs.publish == 'true' && steps.collect.outputs.code == '0'
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "data: $(jq -r .data_date ../summary.json) package (run ${{ github.run_id }}/${{ github.run_attempt }})"
          for i in 1 2 3; do
            if git push origin market-data; then exit 0; fi
            git fetch origin market-data && git rebase origin/market-data || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1

      - name: 결과 요약
        if: always()
        working-directory: .
        run: |
          echo "## market-data $(date '+%Y-%m-%d %H:%M KST')" >> "$GITHUB_STEP_SUMMARY"
          echo "게시: ${{ steps.mode.outputs.publish }} / 수집 종료 코드: ${{ steps.collect.outputs.code }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat summary.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            # 로그인 없이(공개 API의 check-run annotations) 구역별 결과를 볼 수 있게 한 줄씩 남긴다(비밀값 없음)
            python -c "import json; s=json.load(open('summary.json', encoding='utf-8')); [print(f'::notice title=market-data {k}::{v.get(\"status\")} rows={v.get(\"rows\")} ok={v.get(\"succeeded\")}/{v.get(\"targets\")} range={v.get(\"date_range\")}') for k, v in s['sections'].items()]; print('::notice title=market-data data_date::' + str(s.get('data_date')) + ' published=' + str(s.get('published')))"
          fi
