name: Session minute cloud preservation

# 67차: 거래일 분봉 원본(350종목)을 GitHub-hosted runner에서 받아 Cloudflare R2에 날짜별로 보존한다.
# 사용자 PC·DB·Ollama와 무관하게 돈다. 문서: docs/SESSION_MINUTE_CLOUD_AUTOMATION_67.md
#
# - 예약(schedule)은 이 파일이 기본 브랜치(main)에 있어야 동작한다. feature 브랜치에서는 예약이 돌지 않는다.
# - 휴장일은 cron이 아니라 Python(app/krx_calendar)이 판단한다(SKIP 기록).
# - 같은 날 두 번 예약했다. 첫 실행이 지연·누락·실패해도 두 번째 실행과 다음 거래일 실행이 최근 7거래일을 다시 확인해 채운다(멱등).
# - 저장소가 공개라 실행 로그·artifact도 공개된다. 원본 분봉은 artifact로 올리지 않는다(R2 비공개 버킷에만).
on:
  schedule:
    - cron: "20 20 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "20 23 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = 수집·보존, probe = 원천 접근만 확인(3종목, 비밀값 불필요)"
        type: choice
        options: [collect, probe]
        default: collect
      date:
        description: "이 거래일만(YYYY-MM-DD, 비우면 최근 lookback 거래일)"
        type: string
        default: ""
      lookback:
        description: "확인할 최근 거래일 수(1~7)"
        type: string
        default: "7"
      dry_run:
        description: "원천 요청·업로드 없이 R2 상태만 확인"
        type: boolean
        default: false
      deep_verify:
        description: "봉인된 날짜도 내려받아 SHA-256 재계산"
        type: boolean
        default: false
  # feature 브랜치에서 이 기능 파일이 바뀌면 R2 없이 검증한다(cloud-unit + 원천 접근 확인). 수집·업로드는 하지 않는다.
  push:
    branches: [feature/backend]
    paths:
      - ".github/workflows/session-minute-cloud.yml"
      - "backend/scripts/run_cloud_session_preservation.py"
      - "backend/scripts/fetch_session_minute.py"
      - "backend/scripts/preserve_session_minute.py"
      - "backend/scripts/load_session_minute.py"
      - "backend/app/session_*.py"
      - "backend/app/krx_calendar.py"
      - "backend/app/data/**"
      - "backend/requirements-cloud.txt"
      - "backend/tests_cloud/**"

# 한 번에 하나만(예약 두 개·수동 실행이 겹쳐도 R2에 동시에 쓰지 않는다). 진행 중인 실행은 취소하지 않는다.
concurrency:
  group: session-minute-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-cloud.txt
      - run: pip install -r requirements.txt -r requirements-cloud.txt
      - name: 수집·검증·R2 보존
        env:
          TZ: Asia/Seoul
          PYTHONIOENCODING: utf-8
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          # 입력값은 env로만 넘긴다(run 줄에 직접 넣지 않음: 스크립트 주입 방지)
          IN_DATE: ${{ inputs.date }}
          IN_LOOKBACK: ${{ inputs.lookback }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_DEEP: ${{ inputs.deep_verify }}
        run: |
          args=(--work-dir "$RUNNER_TEMP/smc" --report "$RUNNER_TEMP/run_report.json")
          if [[ -n "${IN_DATE:-}" ]]; then
            [[ "$IN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "date 형식 오류"; exit 2; }
            args+=(--date "$IN_DATE")
          fi
          if [[ -n "${IN_LOOKBACK:-}" ]]; then
            [[ "$IN_LOOKBACK" =~ ^[1-7]$ ]] || { echo "lookback은 1~7"; exit 2; }
            args+=(--lookback "$IN_LOOKBACK")
          fi
          [[ "${IN_DRY_RUN:-false}" == "true" ]] && args+=(--dry-run)
          [[ "${IN_DEEP:-false}" == "true" ]] && args+=(--deep-verify)
          python -m scripts.run_cloud_session_preservation "${args[@]}"
      - name: 실행 결과(상태만, 원본 없음)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-minute-run-report-${{ github.run_id }}
          path: ${{ runner.temp }}/run_report.json
          retention-days: 14
          if-no-files-found: ignore

  # R2 어댑터(boto3) 단위 테스트 + 67차 단위 테스트. 네트워크·비밀값 없음.
  cloud-unit:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-dummy-jwt-secret-not-a-real-value
      DATABASE_URL: postgresql+psycopg://ci:ci_dummy_pw@127.0.0.1:1/ci_db
      OLLAMA_HOST: 127.0.0.1:1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-cloud.txt
      - run: pip install -r requirements.txt -r requirements-cloud.txt
      - run: python -m pytest tests/test_cloud_session_preservation_67.py tests/test_preserve_session_minute_52.py tests_cloud -q -p no:cacheprovider

  # GitHub 클라우드 IP에서 원천(api.stock.naver.com 분봉)이 응답하는지 3종목만 확인한다. 403·429면 우회하지 않고 실패로 남긴다.
  source-probe:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: 원천 접근 확인(3종목)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m scripts.run_cloud_session_preservation --work-dir "$RUNNER_TEMP/probe" --probe-source
