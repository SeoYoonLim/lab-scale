[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: dev DB(localhost:15432)에 붙는 테스트. DB가 꺼져 있으면 skip된다.
    slow: Ollama LLM을 실제로 호출하는 비결정적 테스트. 기본 실행에서 제외, -m slow로만 실행한다.
    needs_collected_data: 수집된 시세·뉴스·공시·ETF 시세·환율·시장 지수(또는 옛 리포트)가 DB에 있어야 통과하는 integration 테스트. 로컬 dev DB에서는 평소처럼 돌고(마커가 선택을 바꾸지 않는다), 수집 데이터가 없는 CI의 빈 pgvector DB에서는 -m "not needs_collected_data"로 명시적으로 제외한다.
addopts = -m "not slow"
